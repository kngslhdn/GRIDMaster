name: Apply GRIDMaster v7.005 protection patch

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Patch GRIDMaster
        shell: python {0}
        run: |
          from pathlib import Path
          p = Path('GRIDMaster.mq5')
          s = p.read_text(encoding='utf-8')
          if 'v7.005 - CATASTROPHIC BASKET EXIT' in s:
              raise SystemExit('already patched')
          s = s.replace('// v7.004 - BASKET EXIT + RECOVERY GOVERNOR FIX', '// v7.005 - CATASTROPHIC BASKET EXIT + RECOVERY GOVERNOR FIX')
          s = s.replace('#property version   "7.004"', '#property version   "7.005"')
          anchor = 'input double MaxBasketLossUSD=60.0;\n'
          if anchor not in s:
              raise SystemExit('input anchor not found')
          s = s.replace(anchor, anchor + 'input double CatastrophicBasketLossUSD=120.0; // flatten a max-grid basket before emergency DD\n', 1)
          old = '''   //============================================================================================//
   // EMERGENCY - FLATTEN BEFORE HARD LIMIT
   //============================================================================================//
   if(dd>=EmergencyLimit())
   {'''
          new = '''   //============================================================================================//
   // CATASTROPHIC MAX-GRID EXIT
   // Flatten a deeply underwater max-grid basket before recovery/survival can realize
   // the loss ticket-by-ticket while the trend continues against the basket.
   // EXIT ONLY: never creates new exposure.
   //============================================================================================//
   double liveBasketProfit=BuyProfits+SellProfits;
   double liveBasketLoss=(liveBasketProfit<0.0)?-liveBasketProfit:0.0;
   bool maxGridReached=(BuyOrders>=MaxOrders || SellOrders>=MaxOrders);
   if(maxGridReached && CatastrophicBasketLossUSD>0.0 && liveBasketLoss>=CatastrophicBasketLossUSD)
   {
      CurrentState=STATE_EMERGENCY;
      CloseAllManaged("CATASTROPHIC-BASKET");
      UpdateStatus();
      if(BuyOrders==0 && SellOrders==0)
      {
         IsTerminated=true;
         PrintFormat("[PROTECTION] CATASTROPHIC BASKET EXIT | DD=%.2f%% | Loss=%.2f | EA LOCKED",dd,liveBasketLoss);
      }
      Dashboard(dd);
      return;
   }

   //============================================================================================//
   // EMERGENCY - FLATTEN BEFORE HARD LIMIT
   //============================================================================================//
   if(dd>=EmergencyLimit())
   {'''
          if old not in s:
              raise SystemExit('emergency anchor not found')
          s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GRIDMaster.mq5
          git commit -m 'fix: add catastrophic max-grid basket exit v7.005'
          git push
