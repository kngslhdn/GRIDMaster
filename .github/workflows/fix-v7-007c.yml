name: GRIDMaster v7.007c version fix

on:
  push:
    paths:
      - '.github/workflows/fix-v7-007c.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix version
        shell: python
        run: |
          from pathlib import Path
          p=Path('GRIDMaster.mq5')
          s=p.read_text(encoding='utf-8').replace('#property version "7.006"','#property version "7.007"')
          p.write_text(s,encoding='utf-8')
          Path('.github/workflows/fix-v7-007c.yml').unlink()
      - name: Commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add GRIDMaster.mq5 .github/workflows/fix-v7-007c.yml
          git commit -m 'Set GRIDMaster version to 7.007'
          git push